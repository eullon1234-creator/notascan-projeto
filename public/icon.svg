  <line x1="180" y1="230" x2="280" y2="230" stroke="#34d399" stroke-width="12" stroke-linecap="round"/>
  <line x1="180" y1="275" x2="330" y2="275" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <line x1="180" y1="315" x2="290" y2="315" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <line x1="180" y1="365" x2="250" y2="365" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <!-- Cantoneiras de Scan estilo CamScanner -->
  <path d="M96 160 v-48 a16 16 0 0 1 16 -16 h48" fill="none" stroke="url(#glow)" stroke-width="16" stroke-linecap="round"/>
  <path d="M416 160 v-48 a16 16 0 0 0 -16 -16 h-48" fill="none" stroke="url(#glow)" stroke-width="16" stroke-linecap="round"/>
