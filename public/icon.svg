  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Papel / Documento -->
  <path d="M160 120 h140 l80 80 v200 a24 24 0 0 1 -24 24 H160 a24 24 0 0 1 -24 -24 V144 a24 24 0 0 1 24 -24 z" fill="#0b1329" opacity="0.92"/>
